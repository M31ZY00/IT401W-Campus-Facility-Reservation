<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if is_edit %}
            Edit Facility
        {% else %}
            Add Facility
        {% endif %}
    </title>
</head>

<body>

    <h1>
        {% if is_edit %}
            Edit Facility: {{ facility.name }}
        {% else %}
            Add New Facility
        {% endif %}
    </h1>

    <a href="{% url 'manage_facilities' %}">
        Back to Facility Management
    </a>

    <hr>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            {% if is_edit %}
                Update Facility
            {% else %}
                Save Facility
            {% endif %}
        </button>
    </form>

</body>
</html>
